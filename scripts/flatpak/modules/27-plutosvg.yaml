name: plutosvg
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DPLUTOSVG_BUILD_EXAMPLES=OFF"
build-options:
  strip: true
sources:
  - type: git
    url: "https://github.com/sammycage/plutosvg.git"
    commit: "fd8a080b3d0bccc41f1ae708d3785e7f08398a58"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share
