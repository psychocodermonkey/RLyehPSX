name: shaderc
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DSHADERC_SKIP_TESTS=ON"
  - "-DSHADERC_SKIP_EXAMPLES=ON"
  - "-DSHADERC_SKIP_COPYRIGHT_CHECK=ON"
build-options:
  strip: true
sources:
  - type: archive
    url: "https://github.com/google/shaderc/archive/refs/tags/v2026.3.tar.gz"
    sha256: "ee493ccf1b3038b4ef2fe024664c5eb2dc4bcc1f6b05b33e3909de0e19c81024"
  - type: git
    url: "https://github.com/KhronosGroup/SPIRV-Headers.git"
    commit: "29981f65241605e08b0ede4cfeb999fe3b723c6a"
    dest: "third_party/spirv-headers"
  - type: git
    url: "https://github.com/KhronosGroup/SPIRV-Tools.git"
    commit: "b707790a898e44038547df54580022fc1cf89c3d"
    dest: "third_party/spirv-tools"
  - type: git
    url: "https://github.com/KhronosGroup/glslang.git"
    commit: "168d452a4f460d24b588fed08477a81c44ee27a1"
    dest: "third_party/glslang"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
